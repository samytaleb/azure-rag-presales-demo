name: Presales extension — offline tests
on:
  # Portfolio fork: run verification only when explicitly requested.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check unit tests
        run: python -m unittest discover -s presales_demo/tests -v
      - name: Validate upstream TXT ingestion staging
        run: python -m presales_demo.prepare_corpus --output /tmp/presales-staging
      - name: Replay deterministic synthetic evaluation fixtures
        run: |
          python -m presales_demo.evaluate --mode fixtures --report /tmp/presales-evaluation.json
          python -m presales_demo.report_html --input /tmp/presales-evaluation.json --output /tmp/presales-evaluation.html
